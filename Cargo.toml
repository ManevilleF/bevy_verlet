[package]
name = "bevy_verlet"
version = "0.10.0"
edition = "2021"
authors = ["Felix de Maneville <felix.maneville@gmail.com>"]
repository = "https://github.com/ManevilleF/bevy_verlet"
license-file = "./LICENSE"
exclude = ["docs", ".github"]
description = "Verlet physics implementation in bevy"
keywords = ["verlet", "physics", "bevy", "cloth"]
categories = ["game-engines", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/bevy_verlet"

[features]
default = ["debug"]
debug = ["bevy/bevy_gizmos", "bevy/bevy_gizmos_render"]

[dependencies]

[dependencies.bevy]
version = "0.18"
default-features = false
features = [
    "bevy_log"
]

[dev-dependencies]

[dev-dependencies.bevy]
version = "0.18"
features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_color",
    "bevy_sprite",
    "bevy_camera",
    "bevy_light",
    "bevy_sprite_render",
    "x11",
    "multi_threaded",
    "tonemapping_luts",
    "reflect_auto_register",
    "zstd_rust"
]
default-features = false

[[example]]
name = "2d_cloth"
required-features = ["debug"]

[[example]]
name = "2d_cloth_cutter"
required-features = ["debug"]

[[example]]
name = "2d_line"
required-features = ["debug"]

[[example]]
name = "3d_cloth"
required-features = ["debug"]

[[example]]
name = "3d_line"
required-features = ["debug"]

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
